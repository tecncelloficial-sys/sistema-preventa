<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sistema de Preventa - Control de Local</title>

<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a;
    --text:#e8eaed; --muted:#9aa3b2; --accent:#4f8cff; --accent2:#2ecf8f;
    --warn:#ffb84f; --danger:#ff5c5c; --radius:14px;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);}
  #app{max-width:1100px;margin:0 auto;padding:16px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  header h1{font-size:18px;margin:0;}
  header .badge{font-size:11px;color:var(--muted);background:var(--panel2);padding:4px 10px;border-radius:20px;border:1px solid var(--border);}
  nav{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
  nav button{background:var(--panel);color:var(--muted);border:1px solid var(--border);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:13px;}
  nav button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .card h2{font-size:15px;margin:0 0 14px;color:var(--text);}
  label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px;}
  input,select,textarea{width:100%;background:var(--panel2);border:1px solid var(--border);color:var(--text);padding:10px;border-radius:8px;font-size:14px;}
  textarea{resize:vertical;min-height:60px;}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  @media(max-width:640px){.row{grid-template-columns:1fr;}}
  button.btn{cursor:pointer;border:none;padding:11px 18px;border-radius:10px;font-size:14px;font-weight:600;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-success{background:var(--accent2);color:#04231a;}
  .btn-warn{background:var(--warn);color:#2a1900;}
  .btn-danger{background:var(--danger);color:#2a0000;}
  .btn-ghost{background:transparent;border:1px solid var(--border);color:var(--text);}
  .btn-sm{padding:7px 12px;font-size:12px;}
  .muted{color:var(--muted);font-size:12px;}
  .pill{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:600;}
  .pill-pend{background:#3a2f10;color:var(--warn);}
  .pill-ok{background:#0f2e22;color:var(--accent2);}
  .pill-mora{background:#3a1010;color:var(--danger);}
  .pill-done{background:#132540;color:var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);}
  th{color:var(--muted);font-weight:500;font-size:11px;text-transform:uppercase;}
  .client-list-item{padding:12px;background:var(--panel2);border-radius:10px;margin-bottom:8px;border:1px solid var(--border);cursor:pointer;}
  .client-list-item:hover{border-color:var(--accent);}
  .flex{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .space-between{display:flex;justify-content:space-between;align-items:center;}
  video,#photoPreview{width:100%;max-width:320px;border-radius:10px;background:#000;}
  #photoPreview{display:none;}
  .stat{background:var(--panel2);border-radius:10px;padding:14px;text-align:center;}
  .stat .num{font-size:24px;font-weight:700;}
  .stat .lbl{font-size:11px;color:var(--muted);margin-top:4px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:640px){.grid4{grid-template-columns:repeat(2,1fr);}}
  .lockscreen{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:60vh;text-align:center;}
  .pindots{display:flex;gap:10px;margin:20px 0;}
  .pindot{width:14px;height:14px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);}
  .pindot.filled{background:var(--accent);}
  .keypad{display:grid;grid-template-columns:repeat(3,70px);gap:12px;}
  .keypad button{width:70px;height:70px;border-radius:50%;background:var(--panel2);border:1px solid var(--border);color:var(--text);font-size:20px;}
  #printArea{display:none;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);padding:12px 20px;border-radius:10px;font-size:13px;z-index:999;box-shadow:0 4px 20px rgba(0,0,0,.4);}
  .doc-frame{background:#fff;color:#111;padding:24px;border-radius:8px;font-size:12px;line-height:1.5;}
  .doc-frame h3{text-align:center;margin-bottom:4px;}
  .doc-frame table{font-size:11px;}
  .doc-frame td,.doc-frame th{border:1px solid #ccc;padding:6px;color:#111;}
  .sig-line{border-top:1px solid #111;margin-top:60px;padding-top:6px;text-align:center;font-size:11px;}
  code{background:var(--panel2);padding:2px 6px;border-radius:4px;font-size:11px;color:var(--accent2);}
  pre{background:var(--panel2);padding:12px;border-radius:8px;overflow:auto;font-size:11px;max-height:300px;}
  .imei-warn{color:var(--danger);font-size:12px;margin-top:4px;}
  .imei-ok{color:var(--accent2);font-size:12px;margin-top:4px;}
</style>
</head>
<body>
<div id="app"></div>
<div id="printArea"></div>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script>
// ---------------- FIREBASE (base de datos centralizada) ----------------
const firebaseConfig = {
  apiKey: "AIzaSyAdpW1dO288j5x-rOdO6VVigLxqFJpd5Dk",
  authDomain: "sistema-preventa-9f549.firebaseapp.com",
  projectId: "sistema-preventa-9f549",
  storageBucket: "sistema-preventa-9f549.firebasestorage.app",
  messagingSenderId: "1014356013557",
  appId: "1:1014356013557:web:0eb1b02aa9c58251ee30bc"
};
let db = null;
let FIREBASE_READY = false;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  FIREBASE_READY = true;
}catch(e){ console.error('Error iniciando Firebase', e); }

const FIRESTORE_COLLECTION = 'preventa_data';

// ---------------- EMAIL NOTIFICATIONS (EmailJS) ----------------
// PASO A COMPLETAR: reemplazá estos 3 valores con los tuyos de emailjs.com (plan gratuito)
const EMAILJS_PUBLIC_KEY = 'j5q6PJqSwUuGhqZOY';
const EMAILJS_SERVICE_ID = 'service_17g5jow';
const EMAILJS_TEMPLATE_ID = 'template_x6i5sdk';
const EMAILJS_DEST_EMAIL = 'tecncelloficial@gmail.com'; // a dónde te llegan los avisos

let EMAILJS_READY = false;
try{
  if(window.emailjs && EMAILJS_PUBLIC_KEY !== 'TU_PUBLIC_KEY'){
    emailjs.init(EMAILJS_PUBLIC_KEY);
    EMAILJS_READY = true;
  }
}catch(e){ console.warn('EmailJS no inicializado', e); }

function sendEmailNotification(subject, bodyObj){
  if(!EMAILJS_READY){
    console.log('[EmailJS deshabilitado - configurá tus claves] Evento:', subject, bodyObj);
    return;
  }
  const params = {
    to_email: EMAILJS_DEST_EMAIL,
    subject: subject,
    message: JSON.stringify(bodyObj, null, 2)
  };
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(()=>console.log('Email enviado:', subject))
    .catch(err=>console.error('Error enviando email', err));
}

// Email amigable al cliente (sin datos técnicos internos del sistema)
function sendClientEmail(clienteEmail, subject, mensajeHtml){
  if(!EMAILJS_READY || !clienteEmail) return;
  const params = {
    to_email: clienteEmail,
    subject: subject,
    message: mensajeHtml
  };
  emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, params)
    .then(()=>console.log('Email al cliente enviado:', subject))
    .catch(err=>console.error('Error enviando email al cliente', err));
}

// ---------------- STORAGE HELPERS (Firebase Firestore) ----------------
const KEY_CLIENTS = 'clients';
const KEY_USERS = 'users';
const KEY_LOG = 'auditlog';
const KEY_SETTINGS = 'settings';

async function loadDB(key, fallback){
  if(!FIREBASE_READY){
    try{ const raw = localStorage.getItem('preventa:'+key); return raw ? JSON.parse(raw) : fallback; }
    catch(e){ return fallback; }
  }
  try{
    const doc = await db.collection(FIRESTORE_COLLECTION).doc(key).get();
    if(doc.exists && doc.data() && doc.data().value !== undefined) return doc.data().value;
    return fallback;
  }catch(e){ console.error('Firestore load error ('+key+')', e); return fallback; }
}

async function saveDB(key, value){
  if(!FIREBASE_READY){
    try{ localStorage.setItem('preventa:'+key, JSON.stringify(value)); }catch(e){}
    return;
  }
  try{
    await db.collection(FIRESTORE_COLLECTION).doc(key).set({ value: value, updatedAt: new Date().toISOString() });
  }catch(e){ console.error('Firestore save error ('+key+')', e); }
}

// Sincronización en tiempo real: si otro dispositivo (cliente o vendedor) modifica
// la lista de clientes, este dispositivo se actualiza solo, sin recargar la página.
function subscribeRealtime(){
  if(!FIREBASE_READY) return;
  db.collection(FIRESTORE_COLLECTION).doc(KEY_CLIENTS).onSnapshot(function(doc){
    if(doc.exists && doc.data() && doc.data().value){
      STATE.clients = doc.data().value;
      render();
    }
  }, function(err){ console.error('Error de sincronización en tiempo real', err); });
}

let STATE = {
  clients: [],
  users: [ { id:'u1', name:'Admin', pin:'1234', role:'admin' } ],
  log: [],
  settings: { moraPct: 10, negocio: 'Mi Local', imeiBlacklist: [] },
  currentUser: null,
  tab: 'registro',
  editingClientId: null,
  photoDataUrl: null,
  gps: null
};

async function initState(){
  STATE.clients = await loadDB(KEY_CLIENTS, []);
  const u = await loadDB(KEY_USERS, null);
  STATE.users = u || STATE.users;
  STATE.log = await loadDB(KEY_LOG, []);
  const s = await loadDB(KEY_SETTINGS, null);
  STATE.settings = s || STATE.settings;
  render();
  subscribeRealtime();
}

function uid(){ return 'c_' + Math.random().toString(36).slice(2,10); }

function addLog(action, detail){
  STATE.log.unshift({
    id: uid(), ts: new Date().toISOString(), user: STATE.currentUser ? STATE.currentUser.name : 'Cliente',
    action, detail
  });
  saveDB(KEY_LOG, STATE.log);
}

function toast(msg){
  const t = document.createElement('div');
  t.className='toast'; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2600);
}

// ---------------- BUSINESS LOGIC ----------------
function newClientRecord(){
  return {
    id: uid(),
    createdAt: new Date().toISOString(),
    nombre:'', dni:'', telefono:'', email:'', emailVendedor:'',
    equipo:'', imei:'', montoTotal:0, interesFijo:0,
    dniFrenteFoto:null, dniDorsoFoto:null,
    fotoDataUrl:null, gps:null, tycAceptadoAt:null,
    status:'pendiente_datos_cliente', // pendiente_datos_cliente -> pendiente_aprobacion -> aprobado -> cuota1_pagada -> cuota2_pagada -> completado -> cancelado
    creadoPor:null,
    aprobadoPor:null, aprobadoAt:null,
    cuotas: [
      { n:1, monto:0, vencimiento:null, pagado:false, pagadoAt:null, recargoAplicado:false },
      { n:2, monto:0, vencimiento:null, pagado:false, pagadoAt:null, recargoAplicado:false },
      { n:3, monto:0, vencimiento:null, pagado:false, pagadoAt:null, recargoAplicado:false }
    ],
    entregado:false, entregadoAt:null, entregadoPor:null
  };
}

function calcCuotaMonto(total, interes){
  const conInteres = Number(total) * (1 + Number(interes)/100);
  return Math.round((conInteres/3) * 100)/100;
}

function saldoPendiente(cliente){
  let saldo = 0;
  cliente.cuotas.forEach(c=>{
    if(!c.pagado){
      let m = c.monto;
      if(c.recargoAplicado) m = m * (1 + STATE.settings.moraPct/100);
      saldo += m;
    }
  });
  return Math.round(saldo*100)/100;
}

function checkImei(imei){
  return STATE.settings.imeiBlacklist.includes(imei.trim());
}

// ---------------- RENDER ----------------
function render(){
  const app = document.getElementById('app');
  const params = new URLSearchParams(window.location.search);
  const isClientMode = params.get('modo') === 'cliente';
  const clientId = params.get('id');

  if(isClientMode){
    app.innerHTML = `
      <header>
        <h1>📱 ${STATE.settings.negocio}</h1>
        <span class="badge" style="color:${FIREBASE_READY?'var(--accent2)':'var(--danger)'};">${FIREBASE_READY?'☁️ Conectado':'⚠️ Sin conexión'}</span>
      </header>
      <div id="content"></div>
    `;
    renderClienteCompletar(document.getElementById('content'), clientId);
    return;
  }

  app.innerHTML = `
    <header>
      <h1>📱 ${STATE.settings.negocio} — Sistema de Preventa</h1>
      <span class="badge">${STATE.currentUser ? '👤 '+STATE.currentUser.name+' (Vendedor)' : 'Modo Cliente'}</span>
      <span class="badge" style="color:${FIREBASE_READY?'var(--accent2)':'var(--danger)'};">${FIREBASE_READY?'☁️ Conectado':'⚠️ Sin conexión (local)'}</span>
    </header>
    <nav>
      <button data-tab="registro" class="${STATE.tab==='registro'?'active':''}">📝 Nuevo Cliente</button>
      <button data-tab="vendedor" class="${STATE.tab==='vendedor'?'active':''}">🔐 Panel Vendedor</button>
      <button data-tab="dashboard" class="${STATE.tab==='dashboard'?'active':''}">📊 Dashboard</button>
      <button data-tab="integracion" class="${STATE.tab==='integracion'?'active':''}">🔗 Integración</button>
      <button data-tab="config" class="${STATE.tab==='config'?'active':''}">⚙️ Configuración</button>
    </nav>
    <div id="content"></div>
  `;
  document.querySelectorAll('nav button').forEach(b=>{
    b.onclick = ()=>{ STATE.tab = b.dataset.tab; STATE.editingClientId=null; render(); };
  });
  const content = document.getElementById('content');
  if(STATE.tab==='registro') renderRegistro(content);
  if(STATE.tab==='vendedor') renderVendedor(content);
  if(STATE.tab==='dashboard') renderDashboard(content);
  if(STATE.tab==='integracion') renderIntegracion(content);
  if(STATE.tab==='config') renderConfig(content);
}

// ---------------- TAB: NUEVO CLIENTE (paso del vendedor) ----------------
function renderRegistro(content){
  if(!window.__draftClient) window.__draftClient = newClientRecord();
  if(window.__draftCreated){
    renderQRGenerado(content, window.__draftCreated);
    return;
  }
  const c = window.__draftClient;

  content.innerHTML = `
    <div class="card">
      <h2>Paso 1 — Datos básicos del Cliente</h2>
      <div class="row">
        <div><label>Nombre y Apellido</label><input id="f_nombre" value="${c.nombre}"></div>
        <div><label>DNI / Pasaporte</label><input id="f_dni" value="${c.dni}"></div>
      </div>
      <div class="row">
        <div><label>Teléfono</label><input id="f_tel" value="${c.telefono}"></div>
        <div><label>Email del cliente</label><input id="f_email" value="${c.email}" placeholder="Se usará para verificar identidad en el celular"></div>
      </div>
      <p class="muted">⚠️ Este email debe ser el mismo que el cliente vuelva a escribir en su celular — si no coinciden, no va a poder continuar el registro.</p>
    </div>

    <div class="card">
      <h2>Paso 2 — Servicio / Equipo Reservado</h2>
      <div class="row">
        <div><label>Equipo (modelo)</label><input id="f_equipo" value="${c.equipo}" placeholder="Ej: iPhone 13 128GB"></div>
        <div><label>IMEI</label><input id="f_imei" value="${c.imei}" placeholder="15 dígitos"></div>
      </div>
      <div id="imeiCheckMsg"></div>
      <div class="row">
        <div><label>Monto total del equipo ($)</label><input id="f_monto" type="number" value="${c.montoTotal||''}"></div>
        <div><label>Interés fijo total (%)</label><input id="f_interes" type="number" value="${c.interesFijo||''}"></div>
      </div>
      <p class="muted">Se dividirá en 3 cuotas iguales sobre el monto + interés.</p>
    </div>

    <div class="card">
      <h2>Paso 3 — Foto del DNI (frente y dorso)</h2>
      <p class="muted">Sacá foto del documento físico del cliente con la cámara de este equipo.</p>
      <div class="row">
        <div>
          <label>Frente del DNI</label>
          <video id="videoFrente" autoplay playsinline style="display:none;"></video>
          <img id="previewFrente" alt="DNI frente" style="display:${c.dniFrenteFoto?'block':'none'};" src="${c.dniFrenteFoto||''}">
          <div class="flex" style="margin-top:6px;">
            <button class="btn btn-ghost btn-sm" id="btnCamFrente">📷 Activar cámara</button>
            <button class="btn btn-primary btn-sm" id="btnShotFrente" style="display:none;">Capturar frente</button>
          </div>
        </div>
        <div>
          <label>Dorso del DNI</label>
          <video id="videoDorso" autoplay playsinline style="display:none;"></video>
          <img id="previewDorso" alt="DNI dorso" style="display:${c.dniDorsoFoto?'block':'none'};" src="${c.dniDorsoFoto||''}">
          <div class="flex" style="margin-top:6px;">
            <button class="btn btn-ghost btn-sm" id="btnCamDorso">📷 Activar cámara</button>
            <button class="btn btn-primary btn-sm" id="btnShotDorso" style="display:none;">Capturar dorso</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card">
      <button class="btn btn-success" id="btnSubmitClient">Guardar y generar QR para el cliente →</button>
    </div>
  `;

  document.getElementById('f_nombre').oninput = e=>c.nombre=e.target.value;
  document.getElementById('f_dni').oninput = e=>c.dni=e.target.value;
  document.getElementById('f_tel').oninput = e=>c.telefono=e.target.value;
  document.getElementById('f_email').oninput = e=>c.emailVendedor=e.target.value;
  document.getElementById('f_equipo').oninput = e=>c.equipo=e.target.value;
  document.getElementById('f_imei').oninput = e=>{
    c.imei=e.target.value;
    const msg = document.getElementById('imeiCheckMsg');
    if(c.imei.length>=6){
      if(checkImei(c.imei)) msg.innerHTML = `<p class="imei-warn">⚠️ Este IMEI figura en la lista negra del local. Revisar antes de continuar.</p>`;
      else msg.innerHTML = `<p class="imei-ok">✔️ IMEI no está en lista negra.</p>`;
    } else msg.innerHTML='';
  };
  document.getElementById('f_monto').oninput = e=>c.montoTotal=Number(e.target.value);
  document.getElementById('f_interes').oninput = e=>c.interesFijo=Number(e.target.value);

  function setupCam(videoId, shotBtnId, camBtnId, previewId, onCapture){
    document.getElementById(camBtnId).onclick = async ()=>{
      try{
        const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
        const video = document.getElementById(videoId);
        video.srcObject = stream; video.style.display='block';
        document.getElementById(shotBtnId).style.display='inline-block';
        window['__stream_'+videoId] = stream;
      }catch(e){ toast('No se pudo acceder a la cámara: '+e.message); }
    };
    document.getElementById(shotBtnId).onclick = ()=>{
      const video = document.getElementById(videoId);
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      canvas.getContext('2d').drawImage(video,0,0);
      const dataUrl = canvas.toDataURL('image/jpeg',0.8);
      onCapture(dataUrl);
      const preview = document.getElementById(previewId);
      preview.src = dataUrl; preview.style.display='block';
      video.style.display='none';
      const stream = window['__stream_'+videoId];
      if(stream) stream.getTracks().forEach(t=>t.stop());
      toast('📸 Foto capturada');
    };
  }
  setupCam('videoFrente','btnShotFrente','btnCamFrente','previewFrente', (url)=>c.dniFrenteFoto=url);
  setupCam('videoDorso','btnShotDorso','btnCamDorso','previewDorso', (url)=>c.dniDorsoFoto=url);

  document.getElementById('btnSubmitClient').onclick = async ()=>{
    if(!c.nombre || !c.dni){ toast('Completá nombre y DNI'); return; }
    if(!c.equipo || !c.montoTotal){ toast('Completá el equipo y el monto'); return; }
    if(!c.emailVendedor){ toast('Completá el email del cliente'); return; }
    if(!c.dniFrenteFoto || !c.dniDorsoFoto){ toast('Falta la foto del DNI (frente y dorso)'); return; }
    const monto = calcCuotaMonto(c.montoTotal, c.interesFijo);
    const today = new Date();
    c.cuotas = [1,2,3].map(n=>{
      const venc = new Date(today); venc.setDate(venc.getDate() + n*15);
      return { n, monto, vencimiento: venc.toISOString(), pagado:false, pagadoAt:null, recargoAplicado:false };
    });
    c.status = 'pendiente_datos_cliente';
    c.creadoPor = STATE.currentUser ? STATE.currentUser.name : 'Vendedor';
    STATE.clients.push(c);
    await saveDB(KEY_CLIENTS, STATE.clients);
    addLog('creacion_cliente', `${STATE.currentUser?STATE.currentUser.name:'Vendedor'} cargó datos y DNI de ${c.nombre}`);
    window.__draftCreated = c;
    window.__draftClient = newClientRecord();
    renderQRGenerado(content, c);
  };
}

function renderQRGenerado(content, client){
  const url = window.location.origin + window.location.pathname + '?modo=cliente&id=' + client.id;
  const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(url);
  content.innerHTML = `
    <div class="card" style="text-align:center;">
      <h2>✅ Datos guardados — Ahora que el cliente escanee este QR</h2>
      <p class="muted">Entregá el celular del cliente (o que lo escanee con el suyo) para que complete: confirmación de email, foto biométrica y ubicación GPS.</p>
      <div style="background:#fff;padding:16px;border-radius:10px;display:inline-block;margin:14px 0;">
        <img src="${qrImgUrl}" alt="QR" style="width:240px;height:240px;">
      </div>
      <p class="muted" style="word-break:break-all;">Link directo: ${url}</p>
      <div class="flex" style="justify-content:center;margin-top:14px;">
        <button class="btn btn-primary btn-sm" id="btnNuevoRegistro">+ Cargar otro cliente</button>
        <button class="btn btn-ghost btn-sm" id="btnVerPendientes">Ver en Panel Vendedor</button>
      </div>
    </div>
  `;
  document.getElementById('btnNuevoRegistro').onclick = ()=>{

    window.__draftClient = newClientRecord();

    STATE.tab = 'vendedor';

}

// ---------------- TAB: CLIENTE COMPLETA DESDE SU CELULAR ----------------
function renderClienteCompletar(content, clientId){
  const cl = STATE.clients.find(c=>c.id===clientId);

  if(!cl){
    content.innerHTML = `
      <div class="card" style="text-align:center;">
        <h2>⏳ Cargando...</h2>
        <p class="muted">Si este mensaje no desaparece, pedile al vendedor que verifique el código QR, o esperá unos segundos a que se sincronice.</p>
      </div>
    `;
    // Reintenta una vez que Firestore sincronice
    setTimeout(()=>{ if(new URLSearchParams(window.location.search).get('id')===clientId) render(); }, 1500);
    return;
  }

  if(['pendiente_aprobacion','aprobado','cuota1_pagada','cuota2_pagada','completado'].includes(cl.status)){
    content.innerHTML = `
      <div class="card" style="text-align:center;">
        <h2>✅ ¡Listo, ${cl.nombre}!</h2>
        <p class="muted">Ya completaste tu registro. Esperá que el vendedor revise tus datos en el mostrador para continuar con la firma y el pago.</p>
      </div>
    `;
    return;
  }

  if(!window.__clienteForm) window.__clienteForm = { emailConfirm:'', fotoDataUrl:null, gps:null, tycAceptado:false };
  const f = window.__clienteForm;

  content.innerHTML = `
    <div class="card">
      <h2>Hola${cl.nombre?', '+cl.nombre:''} 👋</h2>
      <p class="muted">Estás por completar tu registro para la reserva de: <b>${cl.equipo}</b></p>
    </div>

    <div class="card">
      <h2>Paso 1 — Confirmá tu email</h2>
      <p class="muted">Escribí el mismo email que le diste al vendedor, para verificar que sos vos.</p>
      <label>Tu email</label>
      <input id="f_emailConfirm" type="email" value="${f.emailConfirm}" placeholder="tu-email@ejemplo.com">
      <div id="emailMatchMsg"></div>
    </div>

    <div class="card">
      <h2>Paso 2 — Foto biométrica en vivo</h2>
      <p class="muted">Sacate una selfie ahora, dentro del local.</p>
      <video id="video" autoplay playsinline style="display:none;"></video>
      <img id="photoPreview" alt="foto" style="display:${f.fotoDataUrl?'block':'none'};" src="${f.fotoDataUrl||''}">
      <div class="flex" style="margin-top:10px;">
        <button class="btn btn-ghost btn-sm" id="btnCam">📷 Activar cámara</button>
        <button class="btn btn-primary btn-sm" id="btnShot" style="display:none;">Tomar foto</button>
      </div>
    </div>

    <div class="card">
      <h2>Paso 3 — Ubicación</h2>
      <button class="btn btn-ghost btn-sm" id="btnGps">📍 Capturar mi ubicación</button>
      <p id="gpsResult" class="muted" style="margin-top:8px;">${f.gps? `✅ GPS: ${f.gps.lat.toFixed(5)}, ${f.gps.lng.toFixed(5)}` : 'GPS no capturado aún'}</p>
    </div>

    <div class="card">
      <label class="flex" style="align-items:flex-start;cursor:pointer;">
        <input type="checkbox" id="f_tyc" style="width:auto;margin-top:3px;" ${f.tycAceptado?'checked':''}>
        <span style="font-size:13px;">Leí y acepto los <b>Términos y Condiciones</b> del plan de reserva, incluyendo el uso de mi foto y ubicación para verificar mi identidad, según lo detallado en el contrato que voy a firmar en el mostrador.</span>
      </label>
    </div>

    <div class="card">
      <button class="btn btn-success" id="btnFinalizar">Finalizar mi registro →</button>
    </div>
  `;

  document.getElementById('f_emailConfirm').oninput = e=>{
    f.emailConfirm = e.target.value;
    const msg = document.getElementById('emailMatchMsg');
    if(f.emailConfirm.length>3){
      const match = f.emailConfirm.trim().toLowerCase() === (cl.emailVendedor||'').trim().toLowerCase();
      msg.innerHTML = match ? '<p class="imei-ok">✔️ Email verificado correctamente.</p>' : '<p class="imei-warn">⚠️ El email no coincide con el que cargó el vendedor.</p>';
    } else msg.innerHTML='';
  };

  document.getElementById('btnCam').onclick = async ()=>{
    try{
      const stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});
      const video = document.getElementById('video');
      video.srcObject = stream; video.style.display='block';
      document.getElementById('btnShot').style.display='inline-block';
      window.__camStream = stream;
    }catch(e){ toast('No se pudo acceder a la cámara: '+e.message); }
  };
  document.getElementById('btnShot').onclick = ()=>{
    const video = document.getElementById('video');
    const canvas = document.createElement('canvas');
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video,0,0);
    f.fotoDataUrl = canvas.toDataURL('image/jpeg',0.8);
    const preview = document.getElementById('photoPreview');
    preview.src = f.fotoDataUrl; preview.style.display='block';
    video.style.display='none';
    if(window.__camStream) window.__camStream.getTracks().forEach(t=>t.stop());
    toast('📸 Foto capturada');
  };
  document.getElementById('btnGps').onclick = ()=>{
    if(!navigator.geolocation){ toast('Geolocalización no soportada'); return; }
    navigator.geolocation.getCurrentPosition(pos=>{
      f.gps = { lat: pos.coords.latitude, lng: pos.coords.longitude, capturedAt: new Date().toISOString() };
      document.getElementById('gpsResult').innerHTML = `✅ GPS: ${f.gps.lat.toFixed(5)}, ${f.gps.lng.toFixed(5)}`;
      toast('📍 Ubicación capturada');
    }, err=>{ toast('Error GPS: '+err.message); }, {enableHighAccuracy:true});
  };
  document.getElementById('f_tyc').onchange = e=>{ f.tycAceptado = e.target.checked; };

  document.getElementById('btnFinalizar').onclick = async ()=>{
    const emailMatch = f.emailConfirm.trim().toLowerCase() === (cl.emailVendedor||'').trim().toLowerCase();
    if(!f.emailConfirm){ toast('Escribí tu email'); return; }
    if(!emailMatch){ toast('El email no coincide con el registrado por el vendedor. Verificalo.'); return; }
    if(!f.fotoDataUrl){ toast('Falta tu foto biométrica'); return; }
    if(!f.gps){ toast('Falta capturar tu ubicación GPS'); return; }
    if(!f.tycAceptado){ toast('Tenés que aceptar los Términos y Condiciones'); return; }

    cl.email = f.emailConfirm.trim();
    cl.fotoDataUrl = f.fotoDataUrl;
    cl.gps = f.gps;
    cl.tycAceptadoAt = new Date().toISOString();
    cl.status = 'pendiente_aprobacion';

    const idx = STATE.clients.findIndex(x=>x.id===cl.id);
    if(idx>=0) STATE.clients[idx] = cl;
    await saveDB(KEY_CLIENTS, STATE.clients);
    addLog('cliente_completo_datos', `${cl.nombre} completó su registro desde su celular (email verificado)`);
    sendEmailNotification('Cliente completó su registro - '+cl.nombre, {
      evento:'cliente_completo_datos', nombre:cl.nombre, dni:cl.dni, email:cl.email,
      equipo:cl.equipo, gps: cl.gps, fecha:new Date().toISOString()
    });
    sendClientEmail(cl.email, 'Recibimos tu registro - '+STATE.settings.negocio,
      'Hola ' + cl.nombre + ',\n\n' +
      'Recibimos tu registro para la reserva del equipo ' + cl.equipo + ' en ' + STATE.settings.negocio + '.\n\n' +
      'Un vendedor va a revisar tus datos en el local y te va a avisar cuando esté aprobado para continuar con la firma del contrato y el pago de la primera cuota.\n\n' +
      'Gracias por elegirnos.'
    );
    window.__clienteForm = null;
    render();
  };
}


function renderVendedor(content){
  if(!STATE.currentUser){
    renderPinLock(content);
    return;
  }
  const esperandoCliente = STATE.clients.filter(c=>c.status==='pendiente_datos_cliente');
  const pendientes = STATE.clients.filter(c=>c.status==='pendiente_aprobacion');
  const activos = STATE.clients.filter(c=>['aprobado','cuota1_pagada','cuota2_pagada'].includes(c.status));
  const completos = STATE.clients.filter(c=>c.status==='completado');

  content.innerHTML = `
    <div class="card space-between">
      <div><strong>Sesión:</strong> ${STATE.currentUser.name}</div>
      <button class="btn btn-ghost btn-sm" id="btnLogout">Cerrar sesión</button>
    </div>

    <div class="card">
      <button class="btn btn-primary" id="btnNuevoCliente">+ Cargar nuevo cliente (datos + DNI)</button>
    </div>

    <div class="card">
      <h2>📲 Esperando que el cliente complete desde su celular (${esperandoCliente.length})</h2>
      ${esperandoCliente.length===0 ? '<p class="muted">No hay clientes esperando completar el QR.</p>' : esperandoCliente.map(cl=>renderClientListItem(cl)).join('')}
    </div>

    <div class="card">
      <h2>🟡 Pendientes de aprobación (${pendientes.length})</h2>
      ${pendientes.length===0 ? '<p class="muted">No hay clientes esperando aprobación.</p>' : pendientes.map(cl=>renderClientListItem(cl)).join('')}
    </div>

    <div class="card">
      <h2>🔵 Planes activos (${activos.length})</h2>
      ${activos.length===0 ? '<p class="muted">No hay planes en curso.</p>' : activos.map(cl=>renderClientListItem(cl)).join('')}
    </div>

    <div class="card">
      <h2>✅ Completados / Entregados (${completos.length})</h2>
      ${completos.length===0 ? '<p class="muted">Ninguno todavía.</p>' : completos.map(cl=>renderClientListItem(cl)).join('')}
    </div>

    <div id="clientDetail"></div>
  `;
  document.getElementById('btnLogout').onclick = ()=>{ STATE.currentUser=null; render(); };
  document.getElementById('btnNuevoCliente').onclick = ()=>{
    window.__draftCreated = null;
    window.__draftClient = newClientRecord();
    STATE.tab = 'registro';
    render();
  };
  content.querySelectorAll('[data-openclient]').forEach(el=>{
    el.onclick = ()=>{ STATE.editingClientId = el.dataset.openclient; renderClientDetail(); };
  });
  if(STATE.editingClientId) renderClientDetail();
}

function statusPill(status){
  const map = {
    pendiente_datos_cliente:['pill-pend','Esperando datos del cliente'],
    pendiente_aprobacion:['pill-pend','Pendiente aprobación'],
    aprobado:['pill-ok','Aprobado - Cuota 1 pendiente'],
    cuota1_pagada:['pill-ok','Cuota 1 pagada'],
    cuota2_pagada:['pill-ok','Cuota 2 pagada'],
    completado:['pill-done','Completado'],
    cancelado:['pill-mora','Cancelado']
  };
  const [cls,label] = map[status] || ['pill-pend',status];
  return `<span class="pill ${cls}">${label}</span>`;
}

function renderClientListItem(cl){
  return `
    <div class="client-list-item" data-openclient="${cl.id}">
      <div class="space-between">
        <div>
          <strong>${cl.nombre}</strong> — DNI ${cl.dni}<br>
          <span class="muted">${cl.equipo} · IMEI ${cl.imei||'-'}</span>
        </div>
        <div>${statusPill(cl.status)}</div>
      </div>
    </div>
  `;
}

function renderClientDetail(){
  const cl = STATE.clients.find(c=>c.id===STATE.editingClientId);
  if(!cl) return;
  const box = document.getElementById('clientDetail');
  const saldo = saldoPendiente(cl);
  const emailMatch = cl.email && cl.emailVendedor && cl.email.trim().toLowerCase()===cl.emailVendedor.trim().toLowerCase();
  box.innerHTML = `
    <div class="card">
      <div class="space-between">
        <h2>Detalle: ${cl.nombre}</h2>
        <button class="btn btn-ghost btn-sm" id="btnCloseDetail">Cerrar</button>
      </div>
      <div class="row">
        <div>
          <p><strong>DNI:</strong> ${cl.dni}</p>
          <p><strong>Tel:</strong> ${cl.telefono||'-'}</p>
          <p><strong>Email vendedor:</strong> ${cl.emailVendedor||'-'}</p>
          <p><strong>Email confirmado por cliente:</strong> ${cl.email||'-'} ${cl.email ? (emailMatch ? '<span class="pill pill-ok">Coincide ✔️</span>' : '<span class="pill pill-mora">No coincide ⚠️</span>') : ''}</p>
          <p><strong>Equipo:</strong> ${cl.equipo} (IMEI ${cl.imei||'-'})</p>
          <p><strong>Monto total:</strong> $${cl.montoTotal} + ${cl.interesFijo}% interés</p>
          <p><strong>Saldo pendiente:</strong> $${saldo}</p>
          <p><strong>Cargado por:</strong> ${cl.creadoPor||'-'} el ${new Date(cl.createdAt).toLocaleString()}</p>
          <p><strong>GPS del cliente:</strong> ${cl.gps ? `${cl.gps.lat.toFixed(5)}, ${cl.gps.lng.toFixed(5)}` : '- (esperando que complete desde su celular)'}</p>
          <p><strong>T&C aceptados:</strong> ${cl.tycAceptadoAt ? new Date(cl.tycAceptadoAt).toLocaleString() : '- (pendiente)'}</p>
        </div>
        <div>
          <p class="muted" style="margin:0 0 4px;">DNI Frente</p>
          ${cl.dniFrenteFoto ? `<img src="${cl.dniFrenteFoto}" style="width:100%;max-width:200px;border-radius:8px;margin-bottom:8px;">` : '<p class="muted">Sin foto</p>'}
          <p class="muted" style="margin:0 0 4px;">DNI Dorso</p>
          ${cl.dniDorsoFoto ? `<img src="${cl.dniDorsoFoto}" style="width:100%;max-width:200px;border-radius:8px;margin-bottom:8px;">` : '<p class="muted">Sin foto</p>'}
          <p class="muted" style="margin:0 0 4px;">Selfie biométrica</p>
          ${cl.fotoDataUrl ? `<img src="${cl.fotoDataUrl}" style="width:100%;max-width:200px;border-radius:8px;">` : '<p class="muted">Sin foto (esperando cliente)</p>'}
        </div>
      </div>

      ${cl.status==='pendiente_datos_cliente' ? `
        <div style="margin-top:14px;text-align:center;">
          <p class="muted">Este cliente todavía no completó el registro desde su celular. Volvé a mostrarle el QR:</p>
          <div id="qrReprint" style="background:#fff;padding:14px;border-radius:10px;display:inline-block;"></div>
        </div>
      ` : ''}

      ${cl.status==='pendiente_aprobacion' ? `
        <div style="margin-top:14px;">
          ${!emailMatch ? '<p class="imei-warn">⚠️ El email del cliente NO coincide con el que cargaste vos. Revisá antes de aprobar.</p>' : '<p class="imei-ok">✔️ Email verificado correctamente.</p>'}
          <p class="muted">⚠️ Verificá el DNI físico contra la foto y los datos antes de aprobar.</p>
          <button class="btn btn-success" id="btnAprobar">✔️ Aprobar y generar pagaré</button>
          <button class="btn btn-danger" id="btnRechazar">✖️ Rechazar</button>
        </div>
      ` : ''}

      ${['aprobado','cuota1_pagada','cuota2_pagada'].includes(cl.status) ? renderCuotasPanel(cl) : ''}

      ${cl.status==='completado' ? `
        <div style="margin-top:14px;">
          <p class="pill pill-done">Plan completado — Saldo $0</p>
          ${!cl.entregado ? `<button class="btn btn-success" id="btnEntregar">📱 Marcar equipo entregado</button>` : `<p class="muted">Entregado el ${new Date(cl.entregadoAt).toLocaleString()} por ${cl.entregadoPor}</p>`}
          <button class="btn btn-ghost btn-sm" id="btnConstancia">🖨️ Imprimir constancia de cancelación</button>
        </div>
      ` : ''}

      <div style="margin-top:14px;">
        <button class="btn btn-ghost btn-sm" id="btnPrintPagare">🖨️ Reimprimir pagaré</button>
      </div>
    </div>
  `;
  document.getElementById('btnCloseDetail').onclick = ()=>{ STATE.editingClientId=null; render(); };

  if(cl.status==='pendiente_datos_cliente'){
    const url = window.location.origin + window.location.pathname + '?modo=cliente&id=' + cl.id;
    const qrImgUrl = 'https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=' + encodeURIComponent(url);
    document.getElementById('qrReprint').innerHTML = `<img src="${qrImgUrl}" style="width:200px;height:200px;">`;
  }

  if(cl.status==='pendiente_aprobacion'){
    document.getElementById('btnAprobar').onclick = async ()=>{
      cl.status='aprobado'; cl.aprobadoPor=STATE.currentUser.name; cl.aprobadoAt=new Date().toISOString();
      await saveDB(KEY_CLIENTS, STATE.clients);
      addLog('aprobacion', `${STATE.currentUser.name} aprobó a ${cl.nombre}`);
      sendEmailNotification('Cliente aprobado - '+cl.nombre, {
        evento:'aprobacion', nombre:cl.nombre, dni:cl.dni, equipo:cl.equipo, imei:cl.imei,
        aprobadoPor: STATE.currentUser.name, fecha:new Date().toISOString()
      });
      printPagare(cl);
      toast('Cliente aprobado. Pagaré generado.');
      render(); STATE.editingClientId=cl.id; renderClientDetail();
    };
    document.getElementById('btnRechazar').onclick = async ()=>{
      cl.status='cancelado';
      await saveDB(KEY_CLIENTS, STATE.clients);
      addLog('rechazo', `${STATE.currentUser.name} rechazó a ${cl.nombre}`);
      toast('Registro rechazado.');
      STATE.editingClientId=null; render();
    };
  }

  document.getElementById('btnPrintPagare').onclick = ()=>printPagare(cl);

  if(['aprobado','cuota1_pagada','cuota2_pagada'].includes(cl.status)){
    cl.cuotas.forEach((cuota, idx)=>{
      const payBtn = document.getElementById('btnPagar'+cuota.n);
      const moraBtn = document.getElementById('btnMora'+cuota.n);
      if(payBtn) payBtn.onclick = async ()=>{
        cuota.pagado = true; cuota.pagadoAt = new Date().toISOString();
        if(cuota.n===1) cl.status='cuota1_pagada';
        if(cuota.n===2) cl.status='cuota2_pagada';
        if(cuota.n===3) cl.status='completado';
        await saveDB(KEY_CLIENTS, STATE.clients);
        addLog('pago_cuota', `${STATE.currentUser.name} registró pago de cuota ${cuota.n} de ${cl.nombre}`);
        sendEmailNotification('Pago cuota '+cuota.n+' - '+cl.nombre, {
          evento:'pago_cuota', nombre:cl.nombre, dni:cl.dni, cuota:cuota.n, monto:cuota.monto,
          recargoAplicado: cuota.recargoAplicado, saldoPendiente: saldoPendiente(cl),
          vendedor: STATE.currentUser.name, fecha:new Date().toISOString()
        });
        printRecibo(cl, cuota);
        toast(`Cuota ${cuota.n} pagada. Recibo generado.`);
        render(); STATE.editingClientId=cl.id; renderClientDetail();
      };
      if(moraBtn) moraBtn.onclick = async ()=>{
        cuota.recargoAplicado = true;
        await saveDB(KEY_CLIENTS, STATE.clients);
        addLog('recargo_mora', `${STATE.currentUser.name} aplicó recargo del ${STATE.settings.moraPct}% a cuota ${cuota.n} de ${cl.nombre}`);
        toast(`Recargo del ${STATE.settings.moraPct}% aplicado a cuota ${cuota.n}`);
        render(); STATE.editingClientId=cl.id; renderClientDetail();
      };
    });
  }

  if(cl.status==='completado'){
    const btnE = document.getElementById('btnEntregar');
    if(btnE) btnE.onclick = async ()=>{
      cl.entregado = true; cl.entregadoAt = new Date().toISOString(); cl.entregadoPor = STATE.currentUser.name;
      await saveDB(KEY_CLIENTS, STATE.clients);
      addLog('entrega', `${STATE.currentUser.name} entregó el equipo a ${cl.nombre}`);
      sendEmailNotification('Equipo entregado - '+cl.nombre, {
        evento:'entrega', nombre:cl.nombre, dni:cl.dni, equipo:cl.equipo, imei:cl.imei,
        entregadoPor: STATE.currentUser.name, fecha:new Date().toISOString()
      });
      toast('📱 Equipo marcado como entregado.');
      render(); STATE.editingClientId=cl.id; renderClientDetail();
    };
    document.getElementById('btnConstancia').onclick = ()=>printConstancia(cl);
  }
}

function renderCuotasPanel(cl){
  const isVencida = (venc)=> new Date(venc) < new Date();
  return `
    <div style="margin-top:14px;">
      <h3 style="font-size:13px;color:var(--muted);">Cuotas</h3>
      <table>
        <tr><th>#</th><th>Monto</th><th>Vencimiento</th><th>Estado</th><th>Acciones</th></tr>
        ${cl.cuotas.map(c=>{
          const vencida = !c.pagado && isVencida(c.vencimiento);
          const montoFinal = c.recargoAplicado ? Math.round(c.monto*(1+STATE.settings.moraPct/100)*100)/100 : c.monto;
          const prevPagada = c.n===1 || cl.cuotas[c.n-2].pagado;
          return `<tr>
            <td>${c.n}</td>
            <td>$${montoFinal} ${c.recargoAplicado?`<span class="muted">(+${STATE.settings.moraPct}% mora)</span>`:''}</td>
            <td>${new Date(c.vencimiento).toLocaleDateString()} ${vencida?'<span class="pill pill-mora">Vencida</span>':''}</td>
            <td>${c.pagado ? '<span class="pill pill-ok">Pagada</span>' : '<span class="pill pill-pend">Pendiente</span>'}</td>
            <td>
              ${!c.pagado && prevPagada ? `<button class="btn btn-success btn-sm" id="btnPagar${c.n}">Cobrar</button>` : ''}
              ${!c.pagado && !c.recargoAplicado && vencida ? `<button class="btn btn-warn btn-sm" id="btnMora${c.n}">+${STATE.settings.moraPct}% Mora</button>` : ''}
            </td>
          </tr>`;
        }).join('')}
      </table>
    </div>
  `;
}

function renderPinLock(content){
  window.__pin = window.__pin || '';
  content.innerHTML = `
    <div class="card lockscreen">
      <h2>🔐 Acceso Vendedor / Administrador</h2>
      <p class="muted">Ingresá tu PIN para validar operaciones</p>
      <div class="pindots">
        ${[0,1,2,3].map(i=>`<div class="pindot ${window.__pin.length>i?'filled':''}"></div>`).join('')}
      </div>
      <div class="keypad" id="keypad">
        ${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-num="${n}">${n}</button>`).join('')}
        <button data-num="clear">C</button>
        <button data-num="0">0</button>
        <button data-num="back">⌫</button>
      </div>
      <p class="muted" style="margin-top:16px;">PIN demo: 1234</p>
    </div>
  `;
  document.querySelectorAll('#keypad button').forEach(b=>{
    b.onclick = ()=>{
      const n = b.dataset.num;
      if(n==='clear') window.__pin='';
      else if(n==='back') window.__pin = window.__pin.slice(0,-1);
      else if(window.__pin.length<4) window.__pin += n;
      if(window.__pin.length===4){
        const user = STATE.users.find(u=>u.pin===window.__pin);
        if(user){ STATE.currentUser = user; window.__pin=''; toast('Bienvenido '+user.name); render(); }
        else { toast('PIN incorrecto'); window.__pin=''; render(); }
      } else render();
    };
  });
}

// ---------------- TAB: DASHBOARD ----------------
function renderDashboard(content){
  const total = STATE.clients.length;
  const activos = STATE.clients.filter(c=>['aprobado','cuota1_pagada','cuota2_pagada'].includes(c.status)).length;
  const completados = STATE.clients.filter(c=>c.status==='completado').length;
  const pendientes = STATE.clients.filter(c=>c.status==='pendiente_aprobacion').length;
  const cobrarSemana = STATE.clients.reduce((acc,cl)=>{
    cl.cuotas.forEach(c=>{
      if(!c.pagado){
        const dias = (new Date(c.vencimiento) - new Date())/(1000*60*60*24);
        if(dias <= 7) acc += c.recargoAplicado ? c.monto*(1+STATE.settings.moraPct/100) : c.monto;
      }
    });
    return acc;
  },0);
  const moraTotal = STATE.clients.reduce((acc,cl)=>{
    cl.cuotas.forEach(c=>{ if(c.recargoAplicado && !c.pagado) acc += c.monto*(STATE.settings.moraPct/100); });
    return acc;
  },0);

  content.innerHTML = `
    <div class="grid4">
      <div class="stat"><div class="num">${total}</div><div class="lbl">Clientes totales</div></div>
      <div class="stat"><div class="num">${pendientes}</div><div class="lbl">Por aprobar</div></div>
      <div class="stat"><div class="num">${activos}</div><div class="lbl">Planes activos</div></div>
      <div class="stat"><div class="num">${completados}</div><div class="lbl">Completados</div></div>
    </div>
    <div class="grid4" style="margin-top:10px;">
      <div class="stat"><div class="num">$${Math.round(cobrarSemana)}</div><div class="lbl">A cobrar 7 días</div></div>
      <div class="stat"><div class="num">$${Math.round(moraTotal)}</div><div class="lbl">Mora acumulada</div></div>
    </div>

    <div class="card" style="margin-top:14px;">
      <h2>🗂️ Log de auditoría (últimos 30)</h2>
      <table>
        <tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>
        ${STATE.log.slice(0,30).map(l=>`<tr><td>${new Date(l.ts).toLocaleString()}</td><td>${l.user}</td><td>${l.action}</td><td>${l.detail}</td></tr>`).join('')}
      </table>
    </div>
  `;
}

    '<p class="legal-text">El presente documento certifica que el/la cliente arriba mencionado/a reserv&oacute; el equipo detallado, comprometi&eacute;ndose a abonar el total en tres (3) cuotas seg&uacute;n el cronograma indicado. En caso de mora en el pago de cualquier cuota, se aplicar&aacute; un recargo del ', STATE.settings.moraPct, '% sobre el monto adeudado de esa cuota. El equipo ser&aacute; entregado &uacute;nicamente al finalizar el pago total de las tres cuotas pactadas. <b>Ver T&eacute;rminos y Condiciones completos en la p&aacute;gina siguiente.</b></p>',
    '<div class="stamp">Registro biom&eacute;trico y georreferenciado verificado dentro del local al momento del alta &middot; Aprobado por: ', (cl.aprobadoPor||'-'), ' el ', (cl.aprobadoAt? new Date(cl.aprobadoAt).toLocaleString():'-'), '</div>',
    '<div class="signatures">',
      '<div class="sig-box"><div class="line">Firma del Cliente</div><div class="sub">DNI ', cl.dni, '</div></div>',
      '<div class="sig-box"><div class="line">Firma del Vendedor</div><div class="sub">', (cl.aprobadoPor||STATE.currentUser.name), '</div></div>',
    '</div>',
    terminosCondicionesHTML(cl)
  ].join('');
  printShell('Pagare ' + cl.nombre, body);
}

function printRecibo(cl, cuota){
  const docNo = docNumber(cl,'REC') + '-C' + cuota.n;
  const montoFinal = cuota.recargoAplicado ? Math.round(cuota.monto*(1+STATE.settings.moraPct/100)*100)/100 : cuota.monto;
  const body = [
    '<div class="doc-header">',
      '<div><div class="biz">', STATE.settings.negocio, '</div><div class="biz-sub">Comprobante de pago</div></div>',
      '<div class="docmeta">Recibo N&deg; ', docNo, '<br>', new Date().toLocaleString(), '</div>',
    '</div>',
    '<div class="doc-title">Recibo de Pago &mdash; Cuota ', cuota.n, ' de 3</div>',
    '<div class="info-grid">',
      '<div><span class="info-label">Cliente</span><b>', cl.nombre, '</b></div>',
      '<div><span class="info-label">DNI</span>', cl.dni, '</div>',
      '<div class="full"><span class="info-label">Equipo</span>', cl.equipo, '</div>',
      '<div><span class="info-label">Monto abonado</span><b>$', montoFinal, '</b></div>',
      '<div><span class="info-label">Recibido por</span>', STATE.currentUser.name, '</div>',
    '</div>',
    cuota.recargoAplicado ? '<p class="legal-text"><b>Incluye recargo por mora del ' + STATE.settings.moraPct + '%</b> aplicado sobre esta cuota por atraso en el pago.</p>' : '',
    '<table class="doc-table"><tr><th>Concepto</th><th>Detalle</th></tr>',
      '<tr><td>Saldo pendiente restante</td><td>$', saldoPendiente(cl), '</td></tr>',
    '</table>',
    cl.status==='completado' ? '<div class="status-banner">PLAN COMPLETADO &mdash; Equipo habilitado para entrega</div>' : '',
    '<div class="signatures"><div class="sig-box"><div class="line">Firma / Sello</div><div class="sub">', STATE.settings.negocio, '</div></div><div class="sig-box"></div></div>'
  ].join('');
  printShell('Recibo Cuota ' + cuota.n, body);
}

function printConstancia(cl){
  const docNo = docNumber(cl,'CANC');
  const body = [
    '<div class="doc-header">',
      '<div><div class="biz">', STATE.settings.negocio, '</div><div class="biz-sub">Constancia oficial</div></div>',
      '<div class="docmeta">Documento N&deg; ', docNo, '<br>', new Date().toLocaleDateString(), '</div>',
    '</div>',
    '<div class="doc-title">Constancia de Cancelaci&oacute;n Total</div>',
    '<p class="legal-text" style="font-size:12px;">Se certifica que <b>', cl.nombre, '</b> (DNI ', cl.dni, ') ha cancelado en su totalidad el plan de pagos correspondiente al equipo <b>', cl.equipo, '</b> (IMEI ', (cl.imei||'-'), '), habiendo abonado las tres (3) cuotas pactadas en el contrato de reserva original.</p>',
    '<div class="info-grid"><div><span class="info-label">Fecha de cancelaci&oacute;n total</span>', new Date().toLocaleDateString(), '</div><div><span class="info-label">Vendedor</span>', STATE.currentUser.name, '</div></div>',
    '<div class="status-banner">EQUIPO HABILITADO PARA ENTREGA AL CLIENTE</div>',
    '<div class="signatures"><div class="sig-box"><div class="line">Firma / Sello del Vendedor</div></div><div class="sig-box"><div class="line">Firma de Conformidad del Cliente</div></div></div>'
  ].join('');
  printShell('Constancia de Cancelacion', body);
}

// ---------------- INIT ----------------
initState();
</script>
